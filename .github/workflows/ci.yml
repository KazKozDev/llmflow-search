name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Sync locked environment
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check src tests scripts
      - name: Type check
        run: uv run --locked pyright
      - name: Test
        run: uv run --locked pytest tests -q --cov=llmflow_search --cov-report=term-missing:skip-covered
