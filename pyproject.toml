[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llmflow-search"
version = "0.2.0"
description = "LangGraph web research agent for local Ollama"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm-agent", "langgraph", "mcp", "web-research", "fact-checking", "ollama"]

dependencies = [
    "jsonschema>=4.20,<5",
    "langgraph>=0.2",
    "markdown>=3.10",
    "mcp>=1.26,<2",
    "ollama>=0.4",
    "xhtml2pdf>=0.2.17",
]
# The MCP server `footnote-mcp` is a separate sibling package that this agent
# launches and imports one helper from. Install it alongside this package:
#   uv pip install -e ../footnote-mcp "mcp<2"

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8",
    "pytest-cov>=6",
    "rank-bm25>=0.2.2",
    "ruff>=0.11",
]

[project.scripts]
llmflow-search = "llmflow_search:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llmflow_search = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["llmflow_search"]

[tool.coverage.report]
fail_under = 65
show_missing = true
skip_covered = true

[tool.pyright]
include = ["src/llmflow_search"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
